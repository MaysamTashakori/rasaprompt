# CI + استقرار خودکار: هر push روی شاخه‌ی اصلی پروژه ← تست و build ← ارسال به سرور و نصب/به‌روزرسانی
# پیش‌نیاز یک‌باره (Settings → Secrets and variables → Actions):
#   SERVER_HOST (مثلاً IP سرور)، SERVER_USER (مثلاً root)، و یکی از SERVER_SSH_KEY یا SERVER_PASSWORD
#   اختیاری: SERVER_DOMAIN (برای HTTPS خودکار)
name: ci-deploy

on:
  push:
    branches: [main, claude/busy-gauss-to9yjn]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
      - run: npx tsx scripts/build-catalog.ts
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    env:
      HAS_SERVER: ${{ secrets.SERVER_HOST != '' }}
    steps:
      - name: Skip notice
        if: env.HAS_SERVER != 'true'
        run: echo "SERVER_HOST secret is not set; skipping deploy."
      - uses: actions/checkout@v4
        if: env.HAS_SERVER == 'true'
      - name: Package
        if: env.HAS_SERVER == 'true'
        run: git archive --format=zip --prefix=rasaprompt/ -o rasaprompt-deploy.zip HEAD
      - name: Upload to server
        if: env.HAS_SERVER == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          password: ${{ secrets.SERVER_PASSWORD }}
          source: rasaprompt-deploy.zip
          target: /root
      - name: Install / update
        if: env.HAS_SERVER == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          password: ${{ secrets.SERVER_PASSWORD }}
          command_timeout: 40m
          script: |
            set -e
            command -v unzip >/dev/null || (apt-get update -y && apt-get install -y unzip)
            rm -rf /tmp/rasaprompt && unzip -oq /root/rasaprompt-deploy.zip 'rasaprompt/deploy/*' -d /tmp
            DOMAIN='${{ secrets.SERVER_DOMAIN }}' bash /tmp/rasaprompt/deploy/install.sh
            sleep 5 && curl -fsS -o /dev/null -w "health %{http_code}\n" http://127.0.0.1/fa
